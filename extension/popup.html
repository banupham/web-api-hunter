<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Web API Hunter V3</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<h2>Web API Hunter V3</h2>
<div id="tabTitle" class="muted">Current tab</div>
<div id="status" class="status">Checking...</div>

<button id="attach">Start capture</button>
<button id="detach" class="secondary">Stop capture</button>

<hr>

<label>Action name</label>
<input id="actionName" placeholder="e.g. Click Follow">
<div class="row">
  <button id="markStart" class="danger">MARK START</button>
  <button id="markEnd" class="secondary">MARK END</button>
</div>

<div id="actionState" class="action idle">Action window idle</div>

<p class="hint">
Run START_APP.cmd first. Full WebSocket messages are preserved locally. Sensitive headers/query tokens are redacted before events leave the extension.
</p>

<script src="popup.js"></script>
</body>
</html>
