name: Assemble imported ZIP
on:
  push:
    paths:
      - '.github/workflows/assemble-import.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify
        shell: bash
        run: |
          cat .import/part*.b64 | base64 -d > web_api_hunter_v3.zip.new
          echo "d6ffa9f6276c2f894c383c84a39b62d72aa1ec195904cb5dec3f60b52801b8ba  web_api_hunter_v3.zip.new" | sha256sum -c -
          mv web_api_hunter_v3.zip.new web_api_hunter_v3.zip
          rm -rf .import
          rm -f .importing
      - name: Commit exact archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore exact Web API Hunter v3 ZIP"
          git push
